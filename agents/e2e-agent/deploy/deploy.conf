# Sourced by deploy/deploy.sh and deploy/publish.sh. Bash.
#
# Everything that differs between agents' deployments lives in the agent's own
# directory: this file, runtime.env (the pinned production env), and
# grant_iam.sh (run once after the first deploy).

# Agent Runtime display name. It is also this directory's name.
NAME=e2e-agent

# deploy.sh refuses to run unless these are set in the caller's environment...
REQUIRED_ENV=(GITHUB_APP_ID GITHUB_APP_INSTALLATION_ID)
# ...and appends them to the runtime env. Optional ones are appended when set.
FORWARD_ENV=(GITHUB_APP_ID GITHUB_APP_INSTALLATION_ID)
OPTIONAL_FORWARD_ENV=()

# Gemini Enterprise registration (deploy/publish.sh).
PUBLISH_DESCRIPTION="SRE agent that investigates CI/E2E failures"
PUBLISH_TOOL_DESCRIPTION='Investigate a failed GitHub Actions run. Pass TriggerEvent JSON with repo and run_id, e.g. {"trigger_source":"TEST_OPERATOR","repo":"owner/repo","run_id":"123"}.'
