NAME=sre-coordinator

REQUIRED_ENV=(ENV_INTELLIGENCE_AGENT)
FORWARD_ENV=(ENV_INTELLIGENCE_AGENT)
# Unset, the coordinator looks up the Agent Runtime named e2e-agent.
OPTIONAL_FORWARD_ENV=(E2E_AGENT_ENGINE)

PUBLISH_DESCRIPTION="Single front door for CI/CD environment health: answers questions over failure history, and can trigger a live investigation of a specific failed run."
PUBLISH_TOOL_DESCRIPTION="Ask about CI failure history, or investigate a specific GitHub Actions run by repo and run id."
