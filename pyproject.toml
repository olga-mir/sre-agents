# Workspace root. Nothing here is deployed: each agent is its own project
# under agents/ with its own pyproject.toml, Dockerfile and agents-cli
# manifest, and libs/agent_serving is the harness they share. This file only
# gives local development one venv (`uv sync`) and one test run (`task test`).
[project]
name = "sre-agents"
version = "0.1.0"
description = "Workspace root for the SRE agents. See README.md for the layout."
requires-python = ">=3.11,<3.14"
dependencies = ["agent-serving", "e2e-agent", "sre-coordinator"]

[tool.uv]
package = false
# agents-cli playground/run invoke `uv run adk ...` with no flags. This uv
# (0.7) has no default-extras, so these are default groups. Otherwise uv finds
# no project `adk` and executes the pipx binary, which cannot import e2e_agent.
default-groups = ["adk", "dev"]

[tool.uv.workspace]
members = ["agents/*", "libs/*"]

[tool.uv.sources]
agent-serving = { workspace = true }
e2e-agent = { workspace = true }
sre-coordinator = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pyyaml>=6.0"]
adk = [
    "google-adk[mcp]>=2.13.0",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-bigquery>=3.47.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36",
    "google-cloud-aiplatform[agent_engines]>=2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib: each agent keeps its own tests/ with no __init__.py, so basenames
# are not guaranteed unique across the workspace.
addopts = "--import-mode=importlib"
testpaths = ["tests", "agents/*/tests", "libs/*/tests"]
# Fires while importing LlmAgent, from opentelemetry-api. google-adk 2.11.0
# still caps opentelemetry-api at <=1.42.1. The warning is fixed in
# opentelemetry-api 1.43.0 (open-telemetry/opentelemetry-python#5231), which
# that cap excludes.
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry.util._importlib_metadata",
]
