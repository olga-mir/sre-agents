[project]
name = "e2e-agent"
version = "0.1.0"
description = "Source-code comprehension layer for the CI/E2E investigation agent (GEAP)"
# The agents-cli container (Dockerfile) is python:3.12-slim. 3.11 stays the
# floor so a local interpreter and that image stay in the same range.
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.16.1",
    "tree-sitter-go>=0.25.0",
    "PyJWT[crypto]>=2.13.0",
]

[project.optional-dependencies]
adk = ["google-adk[a2a,mcp]>=2.11.0", "google-cloud-secret-manager>=2.30.0", "google-cloud-bigquery>=3.45.0", "opentelemetry-exporter-otlp-proto-http>=1.36"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
# Local SDK for task invoke and task deployments. task deploy is agents-cli.
# The runtime image pins its own copy in src/requirements.txt.
devconnect = ["google-cloud-aiplatform[agent_engines]>=2.1.3"]

[project.scripts]
e2e-agent = "e2e_agent.cli:main"

[project.entry-points."opentelemetry_otlp_credential_provider"]
e2e_agent_gcp = "e2e_agent.otel_auth:gcp_session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/e2e_agent_otel_auth.pth" = "e2e_agent_otel_auth.pth"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fires while importing LlmAgent, from opentelemetry-api. google-adk 2.11.0
# still caps opentelemetry-api at <=1.42.1. The warning is fixed in
# opentelemetry-api 1.43.0 (open-telemetry/opentelemetry-python#5231), which
# that cap excludes.
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry.util._importlib_metadata",
]

# agents-cli playground/run invoke `uv run adk ...` with no flags. This uv
# (0.7) has no default-extras, so the adk extra is also a default group.
# Otherwise uv finds no project `adk` and executes the pipx binary, which
# cannot import e2e_agent.
[dependency-groups]
adk = ["google-adk[a2a,mcp]>=2.11.0", "google-cloud-secret-manager>=2.30.0", "google-cloud-bigquery>=3.45.0", "opentelemetry-exporter-otlp-proto-http>=1.36"]

[tool.uv]
default-groups = ["adk"]
