[project]
name = "agent-serving"
version = "0.1.0"
description = "Shared Agent Runtime serving harness: reasoning-engine routes over an ADK App, and OTLP auth"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi",
    "google-adk[otel-gcp]>=2.13.0,<3.0.0",
    "google-cloud-agentplatform[agent-engines]>=2.7.0,<3.0.0",
    "google-cloud-aiplatform[agent_engines]>=2.7.0,<3.0.0",
    "uvicorn>=0.34",
]

# ADK's generic OTLP exporter sends no Authorization header. The exporter reads
# this provider name when it is constructed, before any agent module loads.
# agent_serving_otel_auth.pth selects it (see agent_serving/otel_auth.py).
[project.entry-points."opentelemetry_otlp_credential_provider"]
agent_serving_gcp = "agent_serving.otel_auth:gcp_session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_serving"]

[tool.hatch.build.targets.wheel.force-include]
"agent_serving_otel_auth.pth" = "agent_serving_otel_auth.pth"
